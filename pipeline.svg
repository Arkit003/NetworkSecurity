    <tspan x="161.0" dy="17.5">ArkitAi.NetworkData</tspan>
  </text>
  <text x="161.0" y="247.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="600">
