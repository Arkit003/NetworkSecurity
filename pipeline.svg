    <tspan x="302.0" dy="0.0">KNNImputer(n_neighbors=3, uniform)</tspan>
    <tspan x="302.0" dy="15.0">target  -1 -&gt; 0</tspan>
    <tspan x="302.0" dy="15.0">no scaling (values already -1...1)</tspan>
  </text>
