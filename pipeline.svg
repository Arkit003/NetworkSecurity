  </text>
  <text x="302.0" y="328.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start">
    <tspan x="302.0" dy="0.0">column count vs schema.yaml</tspan>
    <tspan x="302.0" dy="15.0">KS 2-sample drift test, p &lt; 0.05</tspan>
    <tspan x="302.0" dy="15.0">-&gt; drift_report.yaml</tspan>
  </text>
  <text x="161.0" y="439.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="600">
