    <tspan x="302.0" dy="15.0">writes feature_store.csv</tspan>
    <tspan x="302.0" dy="15.0">train/test split 80/20</tspan>
  </text>
  <text x="161.0" y="343.9" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="600">
